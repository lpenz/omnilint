# Default omnilint configuration shipped in the deb and rpm packages.
#
# The linters below are disabled because they are not available in the
# Debian or Fedora package repositories. Users who install them manually
# can re-enable them by overriding this file or setting enabled = true
# in their own ~/.config/omnilint/omnilint.toml or project omnilint.toml.

[global]
ignore_missing_linters = false

[linters.actionlint]
enabled = false

[linters.chktex]
enabled = false

[linters.clj-kondo]
enabled = false

[linters.go-vet]
enabled = false

[linters.hadolint]
enabled = false

[linters.ktlint]
enabled = false

[linters.markdownlint-cli2]
enabled = false

[linters.oxlint]
enabled = false

[linters.protolint]
enabled = false

[linters.pylint]
enabled = false

[linters.rubocop]
enabled = false

[linters.swiftlint]
enabled = false

[linters.staticcheck]
enabled = false

[linters.stylelint]
enabled = false
