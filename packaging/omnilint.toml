# Default omnilint configuration shipped in the deb and rpm packages.
#
# The linters below are disabled because they are not available in the
# Debian or Fedora package repositories. Users who install them manually
# can re-enable them by overriding this file or setting mode = "wanted"
# in their own ~/.config/omnilint/omnilint.toml or project omnilint.toml.

[linters.actionlint]
mode = "disabled"

[linters.chktex]
mode = "disabled"

[linters.clj-kondo]
mode = "disabled"

[linters.go-vet]
mode = "disabled"

[linters.hadolint]
mode = "disabled"

[linters.ktlint]
mode = "disabled"

[linters.markdownlint-cli2]
mode = "disabled"

[linters.oxlint]
mode = "disabled"

[linters.protolint]
mode = "disabled"

[linters.pylint]
mode = "disabled"

[linters.rubocop]
mode = "disabled"

[linters.swiftlint]
mode = "disabled"

[linters.staticcheck]
mode = "disabled"

[linters.stylelint]
mode = "disabled"
