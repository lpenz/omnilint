---
name: CI
on: [workflow_dispatch, push, pull_request]  # yamllint disable-line rule:truthy
jobs:
  # We can't run omnilint in omnilint because the dirty test files
  # have lint errors by design
  # omnilint:
  #   uses: lpenz/omnilint/.github/workflows/omnilint.yml@v0.9.0
  #   with:
  #     arguments: --config omnilint.toml
  info:
    runs-on: ubuntu-latest
    outputs:
      info_json: ${{ steps.info.outputs.info_json }}
      version_docker_ci: ${{ steps.info.outputs.version_docker_ci }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: info
        uses: docker://lpenz/ghaction-version-gen:0.21.0
  rust-test:
    needs: [info]
    uses: lpenz/ghworkflow-rust/.github/workflows/rust-test.yml@v0.32.0
    with:
      info_json: ${{ needs.info.outputs.info_json }}
      enable_cargo-semver-checks: false
      test_features: '[""]'
      coveralls: true
      deb: true
      rpm: true
  nix-flake:
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runs-on: ubuntu-latest
          - system: aarch64-linux
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
      - name: Set up the lpenz cachix cache
        uses: cachix/cachix-action@v17
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: lpenz
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
      - name: Run the nix-flake test script
        run: ./test-nix.sh ${{ matrix.system }}
  commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2.15.0
        with:
          branch: false
  rust-deploy:
    needs: [info, rust-test, nix-flake, commit-check]
    uses: lpenz/ghworkflow-rust/.github/workflows/rust-deploy.yml@v0.32.0
    with:
      info_json: ${{ needs.info.outputs.info_json }}
      deb: true
      rpm: true
      release_files: |
        omnilint omnilint.1
      publish_cratesio: true
      publish_github_release: true
      publish_github_marketplace: true
      publish_packagecloud_repository_deb: |
        ["debian/debian/trixie",
         "debian/debian/forky",
         "ubuntu/ubuntu/resolute"]
      publish_packagecloud_repository_rpm: |
        ["rpm/rpm_any/rpm_any"]
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
  dockerhub-deploy:
    needs: [info, rust-test, nix-flake, commit-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: needs.info.outputs.version_docker_ci != 'null'
      - uses: docker/build-push-action@v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.info.outputs.version_docker_ci != 'null' }}
          tags: |
            ${{ github.repository }}:${{ needs.info.outputs.version_docker_ci }}
